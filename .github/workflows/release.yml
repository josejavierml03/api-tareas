name: Release

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    environment: produccion
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar collection
        run: ansible-galaxy collection install -r deploy/requirements.yml
      - name: Desplegar version publicada
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -eu
          VAULT_FILE="$(mktemp)"
          trap 'rm -f "$VAULT_FILE"' EXIT
          chmod 600 "$VAULT_FILE"
          printf '%s' "$VAULT_PASS" > "$VAULT_FILE"
          ansible-playbook -i deploy/inventory.ini deploy/deploy.yml \
            --vault-password-file "$VAULT_FILE" --extra-vars "version_app=$VERSION"
